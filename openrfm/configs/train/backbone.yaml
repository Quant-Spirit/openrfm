# context composition of the sampler (openrfm.sampler.RTRetrievalSpec)
sampler:
  version: 3
  archive_cell_order: table_row_col
  composition_algorithm: path_stream_v1
  discovery_scales_with_length: true
  stream_weight_policy: selectivity
  extension_policy: typed_temporal_mix
  protected_core_len: 1024
  rw_extension_percent: 25
  extension_time_unit_seconds: 86400
  seed_block_policy: truncate_priority
  walk_count: 32
  walk_steps: 16
  candidate_count: 256
  seq_len_set: [1024]
  local_cell_budget_set: [1024]
  bfs_width_set: [16, 32, 64, 128]
  recency_set: [0, 1]
  label_visibility: strict_drop
  label_horizon_seconds: null
  support_contract: existing_donor_mask
  traversal: two_stage
  max_hops: 0
  peer_labels_per_1024: 32
  seed_hops: 6
  path_depth: 6
  time_strata: 8
  filler_percent: 0
  support_label_horizon_safe: true

# context programs drawn per request (openrfm.train.backbone.context)
context_prior:
  version: 4
  kind: context_prior
  identity: false
  choices:
    link: [native, direct]
    bridge: [cells, empty]
    column_percent: [100, 75, 50]
    table_percent: [100, 75]
    order: [own_first, mixed, parent_first]
    peers: [absent, random, near, far]
    own_labels: [0, 8, 32, 128]
    own_events: [16, 64, 256]
    peer_labels: [8, 32, 128]
    core: [64, 256, 1024]
    summary: [materialized, raw]
    pack: [default, overlay]
