# Backbone pretraining recipe of the released OpenRFM backbone (exported at step 40000).
#   openrfm generate --config openrfm/configs/data/backbone_corpus.yaml --out GEN ...
#   openrfm train backbone corpus --config openrfm/configs/train/backbone.yaml --generated GEN --out CORPUS
#   openrfm train backbone train --config openrfm/configs/train/backbone.yaml --corpus CORPUS --out RUN
#   openrfm train backbone export --checkpoint RUN/steps=40000.pt --out openrfm_backbone.pt
# CORPUS holds sources/ (one v2 archive per world, with fp32 datetimes), corpus/ (aliased links and
# compact_task_catalog.json) and consumers/ (the frozen TabICL v2 models).
seed: 0
optimizer_steps: 50000
batch_size: 32
grad_accum_steps: 8
# Cells per micro-batch = context_length x batch_size; each micro-batch draws its length from length_mix.
context_length: 1024
length_mix: {256: 0.25, 1024: 0.5, 4096: 0.25}
checkpoint_every: 2000
# links to the archives and the task catalog, under --corpus (written by `train backbone corpus`)
archives: corpus
# task views (world x policy x length) kept on the device; a dropped view is reloaded identically on its next use
resident_views: 4096

optimizer:
  muon_lr: 0.0005
  aux_lr: 0.0003
  weight_decay: 0.1
  momentum: 0.95
  nesterov: true
  ns_steps: 5
  aux_betas: [0.9, 0.95]
  aux_eps: 1.0e-8
  max_grad_norm: 1.0
  warmup_steps: 300
  decay_start_step: 30000
  min_lr_ratio: 0.1

objective:
  multi_cell_mask_p_max: 0.25
  support_fraction: 0.25
  column_slot_weight: 0.25
  column_slot_slots: 16

coupling:
  every: 4
  weight: 0.5
  ramp_steps: 300
  query_fraction: 0.25
  q_min: 4
  handoff_slots: 96
  taps: [1, 2, 3, 4]
  k: 4
  row_depth: 6
  episodes:
    seed: 0
    query_cohort: 64
    encoding_chunk_cells: 32768
    length_mix: {256: 0.6, 1024: 0.4}
    support_mix_by_length:
      256: {32: 0.16666666666666666, 128: 0.16666666666666666, 512: 0.16666666666666666, 1024: 0.16666666666666666, 2048: 0.16666666666666666, 4096: 0.16666666666666666}
      1024: {32: 0.25, 128: 0.25, 512: 0.25, 1024: 0.25}
    task_type_mix: {autocomplete: 0.15, forecast_or_other: 0.85}
  consumers:
    classifier: {file: consumers/classifier.ckpt, repo: jingang/TabICL, source: tabicl-classifier-v2-20260212.ckpt,
                 sha256: bdc7dbd5e4ff21f8f0456fcf90c6b7cdf72dbea960f2d05b19bec19f9b3d4ed0}
    regressor: {file: consumers/regressor.ckpt, repo: jingang/TabICL, source: tabicl-regressor-v2-20260212.ckpt,
                sha256: 0db9cb538f114e79026bf08f45f41ad8dd7ad2de2aaca9a5ca8cd3bd9748ae7a}

# mixture groups, one per generated family, in this order: [family, weight]; consecutive batches of one group
# draw from the systematic schedule over windows of group_window batches. A family without worlds in the corpus
# is left out and the remaining weights are renormalised.
group_window: 1600
