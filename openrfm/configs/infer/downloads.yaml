# Downloads of the benchmark databases and their sha256 (`openrfm download`). RelBench files come from the official
# RelBench server and are unzipped into DATA/<db>/{db,tasks}. The 4DBInfer archives are the unchanged official
# releases (originally served at https://data.dgl.ai/mtbench/, which no longer resolves), mirrored in the Hugging Face
# dataset repository `repo`, each under the terms of its source; each is extracted under DATA/raw/ and written in RelBench layout
# (openrfm.infer.dbinfer). RelBench's own 4DBInfer conversion renumbers primary keys without remapping the foreign keys
# that reference them, so it is not used.
