# Recipe R3: the R2 cell of each task (openrfm/configs/infer/r2.yaml) plus a residual head on the frozen Kumo-Tabular
# prediction, trained per task on its support rows (openrfm/infer/residual.py). `head` gives the learning rate, the
# regression loss (`median`: pinball at the median), the maximum number of updates, the checkpoint steps evaluated on
# the temporal holdout of the support set, the episode support and query sizes and the hidden width.
default:
  classification: {head: {lr: 0.0001, loss: null, steps: 400, checkpoints: [5, 10, 25, 50, 100, 200, 400], support: 512, queries: 128, hidden: 256}}
  regression: {head: {lr: 0.0001, loss: median, steps: 400, checkpoints: [5, 10, 25, 50, 100, 200, 400], support: 512, queries: 128, hidden: 256}}
