[package]
name = "worldgen"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"

[lib]
name = "worldgen"
path = "src/lib.rs"

[[bin]]
name = "worldgen"
path = "src/bin/worldgen.rs"

[[bin]]
name = "worldgen-materialize"
path = "src/bin/worldgen-materialize.rs"


[dependencies]
anyhow = "1.0.100"
arrow-array = "57.1.0"
arrow-schema = "57.1.0"
clap = { version = "4.5.53", features = ["derive"] }
parquet = { version = "57.1.0", features = ["arrow"] }
rand = "0.9.1"
rand_chacha = "0.9.0"
rand_distr = "0.5.1"
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"

