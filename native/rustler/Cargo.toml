[package]
name = "rustler"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[lib]
name = "rustler_archive"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rustler"
path = "src/main.rs"

[features]
# Builds the `rustler_archive` Python extension module (format-v1 decoder) with maturin.
python = ["pyo3/extension-module"]

[dependencies]
polars = { version = "0.52", features = ["lazy", "timezones", "parquet"] }
parquet = "57.1"
serde_json = { version = "1.0", features = ["raw_value"] }
glob = "0.3"
itertools = "0.14"
serde = { version = "1.0", features = ["derive"] }
rayon = "1"
clap = { version = "4.5", features = ["derive"] }
pyo3 = { version = "0.27", features = ["abi3-py310"] }
memmap2 = "0.9"
rkyv = "0.8"
numpy = { version = "0.27", features = ["half"] }
indicatif = "0.18"
half = { version = "2.7", features = ["rkyv"] }
ndarray = "0.17"
anyhow = "1.0"
chrono = "0.4"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
